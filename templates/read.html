<!-- 작성한 글 읽는 페이지-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>글 목록 - 게시판</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='read.css') }}">
</head>
<body>
  <h1>게시판</h1>
  <div class="board-container">

    <!-- 게시글 리스트 -->
    <ul class="post-list">

      {% for post in posts %}
        <li>
          <a href="{{ url_for('post_detail', post_id=post.id) }}">
            {{ post.title if post.title else '[제목 없음]' }}
          </a>
          <span class="meta">조회수: {{ post.views or 0 }}</span>
        </li>
      {% else %}
        <li>게시글이 없습니다.</li>
      {% endfor %}

    </ul>

    <div class="bottom-links">
      <a href="/write">글쓰기</a> | <a href="/">메인으로</a>

    </div>
  </div>
</body>
</html>
