<!--글 조회 페이지-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{{ post.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='view.css') }}">
</head>
<body>
  <div class="container">
    <div class="title">{{ post.title }}</div>
    <div class="views">조회수: {{ post.views }}</div>

    <div class="content">{{ post.content }}</div>

    <div class="buttons">
      <a href="{{ url_for('read') }}">목록으로</a>
      <a href="{{ url_for('edit', post_id=post.id) }}">수정</a>
      <a href="{{ url_for('delete', post_id=post.id) }}" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</a>
    </div>

    <div class="comments">
      <h3>댓글</h3>
      {% if post.comments %}
        {% for comment in post.comments %}
          <div class="comment">{{ comment }}</div>
        {% endfor %}
      {% else %}
        <p>댓글이 아직 없습니다.</p>
      {% endif %}

      <form class="comment-form" action="{{ url_for('add_comment', post_id=post.id) }}" method="post">
        <textarea name="comment" placeholder="댓글을 입력하세요" required></textarea>
        <button type="submit">댓글 달기</button>
      </form>
    </div>
  </div>
</body>
</html>
