<!-- 글 작성 페이지 -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>글쓰기 - 게시판</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='write.css') }}">

</head>
<body>
  <div class="write-container">
    <h1>글쓰기</h1>
    <form method="post">
      <label for="title">제목</label>
      <input type="text" id="title" name="title" required maxlength="100" autocomplete="off" placeholder="제목을 입력하세요" />

      <label for="content">내용</label>
      <textarea id="content" name="content" rows="8" required placeholder="내용을 입력하세요"></textarea>

      <button type="submit">작성 완료</button>
    </form>
    <a href="{{ url_for('board') }}" class="back-link">← 목록으로 돌아가기</a>
  </div>


  <!-- Firebase JS SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyChyqxIaGsdypUuXbBYLe-3LscWOBXmTVs",
      authDomain: "de-homepage.firebaseapp.com",
      projectId: "de-homepage",
      storageBucket: "de-homepage.appspot.com",
      messagingSenderId: "262541009998",
      appId: "1:262541009998:web:b89ac2722ffd39b8054f1f",
      measurementId: "G-E5S3QR6S9K"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function saveToFirebase() {
      const title = document.getElementById('jsTitle').value;
      const content = document.getElementById('jsContent').value;
      try {
        await addDoc(collection(db, "posts"), {
          title: title,
          content: content
        });
        alert("JS로 저장 완료!");
      } catch (e) {
        alert("오류 발생: " + e);
      }
    }
  </script>


</body>
</html>
